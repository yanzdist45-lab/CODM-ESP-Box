name: Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deps
        run: |
          test -f jni/include/zygisk.hpp
          test -f jni/include/dobby.h
          test -f jni/libs/arm64-v8a/libdobby.a
      - name: Configure
        run: cmake -S jni -B build -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - name: Package
        run: |
          mkdir -p module/zygisk
          cp build/libcodm_esp_box.so module/zygisk/arm64-v8a.so
          cd module && zip -r ../CODM-ESP-Box.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CODM-ESP-Box
          path: CODM-ESP-Box.zip
